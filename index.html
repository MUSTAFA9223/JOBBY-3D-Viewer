<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOBBY 3D Character Viewer</title><style>
*{box-sizing:border-box}body{margin:0;background:#101622;color:#fff;font:15px system-ui}header{padding:14px 16px;background:#182235;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-rows:minmax(260px,1fr) auto;height:calc(100dvh - 55px)}#view{position:relative;min-height:0}canvas{display:block}#status{position:absolute;top:12px;left:12px;right:12px;text-align:center;pointer-events:none;color:#d7e2f7}section{padding:12px;background:#182235;display:grid;gap:10px}select,input,button{padding:11px;border:1px solid #3d4b62;border-radius:10px;background:#25334a;color:white;min-width:0}label{display:grid;gap:5px;font-size:12px;color:#c9d5e8}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{cursor:pointer}small{color:#afbed6}a{color:#9bd8ff}</style></head><body>
<header><b>JOBBY · 3D Characters</b><small id="count">Loading…</small></header>
<main><div id="view"><div id="status">Preparing viewer…</div></div><section><div class="controls"><label>Character<select id="character"></select></label><label>Animation<select id="animation"></select></label></div><div class="controls"><button id="play">Pause</button><button id="reset">Reset camera</button></div><small>Drag to rotate · Pinch to zoom · <a href="https://t.me/JOBBY3DViewerBot">Telegram bot</a></small></section></main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const status=document.querySelector('#status'), character=document.querySelector('#character'), animation=document.querySelector('#animation'), view=document.querySelector('#view');
const scene=new THREE.Scene();scene.background=new THREE.Color('#101622');const camera=new THREE.PerspectiveCamera(45,1,.01,500);camera.position.set(2,1.5,3.5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x5b6786,2.5));const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(3,7,5);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);
const loader=new GLTFLoader();let archive,files=[],model,mixer,clock=new THREE.Clock(),paused=false;
function fit(){if(!model)return;const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size.length()*.8,size.length()*.45,size.length()*.8));camera.near=.01;camera.far=500;camera.updateProjectionMatrix();controls.update()}
function selectAnimation(){if(!mixer)return;mixer.stopAllAction();const clip=mixer._root.userData.animations?.[Number(animation.value)];if(clip){mixer.clipAction(clip).reset().play();mixer.timeScale=paused?0:1}}
async function showCharacter(){const f=files[Number(character.value)];if(!f)return;status.textContent='Loading '+f.split('/').pop();try{const raw=await archive.file(f).async('string');const gltf=await new Promise((resolve,reject)=>loader.parse(raw,'',resolve,reject));if(model)scene.remove(model);model=gltf.scene;scene.add(model);mixer=new THREE.AnimationMixer(model);model.userData.animations=gltf.animations;animation.replaceChildren(...gltf.animations.map((a,i)=>new Option(a.name||('Animation '+(i+1)),String(i))));let idle=gltf.animations.findIndex(a=>a.name==='Idle');animation.value=String(Math.max(0,idle));fit();selectAnimation();status.textContent=''}catch(e){status.textContent='Cannot load character: '+e.message;console.error(e)}}
animation.onchange=selectAnimation;character.onchange=showCharacter;document.querySelector('#reset').onclick=fit;document.querySelector('#play').onclick=()=>{paused=!paused;if(mixer)mixer.timeScale=paused?0:1;document.querySelector('#play').textContent=paused?'Play':'Pause'};
async function start(){try{const r=await fetch('./characters.zip');if(!r.ok)throw Error('characters.zip not found ('+r.status+')');const b=await r.arrayBuffer();archive=await JSZip.loadAsync(b);files=Object.keys(archive.files).filter(n=>n.toLowerCase().endsWith('.gltf')).sort();if(!files.length)throw Error('No .gltf files in archive');character.replaceChildren(...files.map((f,i)=>new Option(f.split('/').pop().replace(/\.gltf$/i,'').replaceAll('_',' '),String(i))));document.querySelector('#count').textContent=files.length+' models';await showCharacter()}catch(e){status.textContent=e.message+' — upload the original ZIP to the repository as characters.zip';console.error(e)}}
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(view);renderer.setAnimationLoop(()=>{const d=clock.getDelta();if(mixer)mixer.update(d);controls.update();renderer.render(scene,camera)});start();
</script></body></html>
